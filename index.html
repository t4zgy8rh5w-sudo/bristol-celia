<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise ! 🌸</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* ICI C'EST LE FOND DE DEPART (FOND 1) */
            background-image: url('FOND 1.jpg'); 
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.8s ease-in-out; /* ça fait un fondu stylé quand ça change */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #d35400; }
        p { font-size: 1rem; color: #444; margin-bottom: 20px; }
        
        input {
            width: 80%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ffb347;
            border-radius: 10px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
        }
        input:focus { border-color: #e67e22; }
        
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #d35400; }
        
        /* LE BOUTON QG */
        .btn-qg {
            background-color: #27ae60;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-qg:hover { background-color: #219150; }

        .error { color: #c0392b; margin-top: 10px; font-size: 0.9rem; display: none; }
        
        #secret-content { display: none; }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DU MOT DE PASSE -->
    <div class="card" id="login-box">
        <h1>Chut... 🤫</h1>
        <p>Un petit mot de passe pour la route ?</p>
        <input type="password" id="password-input" placeholder="Mot de passe...">
        <br>
        <button onclick="checkPassword()">Valider</button>
        <div class="error" id="error-msg">Oups, c'est pas ça ! ❌</div>
    </div>

    <!-- CONTENU DÉBLOQUÉ -->
    <div class="card" id="secret-content">
        <h1>Destination Bristol ✈️</h1>
        
        <div class="video-container">
            <!-- N'OUBLIE PAS DE METTRE L'ID DE TA VIDEO ICI -->
            <iframe id="maVideo" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- LE BOUTON POUR ALLER AU QG -->
        <button class="btn-qg" onclick="window.location.href='qg.html'">Accéder au QG 🚀</button>

    </div>

    <script>
        const bonMotDePasse = "Maxou"; 

        function checkPassword() {
            const userPassword = document.getElementById("password-input").value;
            const loginBox = document.getElementById("login-box");
            const secretContent = document.getElementById("secret-content");
            const errorMsg = document.getElementById("error-msg");
            const maVideo = document.getElementById("maVideo");

            if (userPassword === bonMotDePasse) {
                // On cache le code et on affiche la suite
                loginBox.style.display = "none";
                secretContent.style.display = "block";
                
                // ICI ON CHANGE LE FOND POUR METTRE LE FOND 2
                document.body.style.backgroundImage = "url('FOND 2.jpg')";
                
                // On lance la vidéo
                maVideo.src = "https://www.youtube.com/embed/ID_DE_TA_VIDEO?autoplay=1";
            } else {
                errorMsg.style.display = "block";
            }
        }

        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
